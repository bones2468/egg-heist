<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<meta name="description" content="Egg Heist: raid predator-guarded biomes for eggs, train your speed and steal from rival bases.">
<title>Egg Heist</title>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Lilita+One&family=Nunito:wght@600;800&display=swap">
<style>
/* Layout: full-height arcade screen — slim HUD bar, 3D stage, floating touch controls. Deliberately single dark theme. */
:root{
  --night:#0f2a2e; --panel:#0a1c1f; --ink:#f4f1e6; --muted:#9fb8b0;
  --gold:#ffd23f; --danger:#ff6b6b; --ok:#3ee08f; --ice:#7fd8ff;
  --display:"Lilita One","Arial Rounded MT Bold",system-ui,sans-serif;
  --body:"Nunito",system-ui,-apple-system,sans-serif;
  color-scheme:dark;
}
html,body{height:100%;margin:0}
body{background:var(--night);color:var(--ink);font-family:var(--body);overflow:hidden;
  padding-left:max(16px,env(safe-area-inset-left,0px));padding-right:max(16px,env(safe-area-inset-right,0px));box-sizing:border-box}
.app{height:100%;display:flex;flex-direction:column;gap:10px;padding-block:10px;box-sizing:border-box}
header{display:flex;flex-wrap:wrap;align-items:center;gap:8px 18px}
h1{font-family:var(--display);font-weight:400;font-size:1.7rem;margin:0;letter-spacing:.5px;color:var(--gold);text-shadow:0 3px 0 #7a5a00}
.stat{display:flex;flex-direction:column;line-height:1.1;min-width:0}
.stat b{font-family:var(--display);font-weight:400;font-size:1.2rem;font-variant-numeric:tabular-nums;white-space:nowrap}
.stat span{font-size:.68rem;text-transform:uppercase;letter-spacing:.08em;color:var(--muted)}
.help{margin-left:auto;font-size:.8rem;color:var(--muted)}
.stage{position:relative;flex:1;min-height:0;border-radius:14px;overflow:hidden;background:var(--panel);box-shadow:inset 0 0 0 3px #0a2224}
canvas{display:block;width:100%;height:100%;touch-action:none}
.panel{position:absolute;background:rgba(10,28,31,.84);border-radius:10px;padding:8px 10px;font-size:.78rem}
.board{top:10px;right:10px;min-width:160px}
.guide{top:10px;left:10px;min-width:180px}
.panel h2{font-family:var(--display);font-weight:400;font-size:.9rem;margin:0 0 4px;letter-spacing:.05em;color:var(--muted)}
.row{display:flex;gap:8px;align-items:center;font-variant-numeric:tabular-nums;line-height:1.5}
.row i{width:10px;height:10px;border-radius:3px;display:inline-block;flex:none}
.row em{margin-left:auto;font-style:normal;font-weight:800}
.row.safe em{color:var(--ok)} .row.risk em{color:var(--danger)} .row.here{text-decoration:underline}
.toasts{position:absolute;left:50%;bottom:90px;transform:translateX(-50%);display:flex;flex-direction:column-reverse;gap:6px;align-items:center;pointer-events:none;width:min(90%,460px)}
.toast{background:rgba(10,28,31,.9);padding:6px 12px;border-radius:999px;font-weight:800;font-size:.85rem;text-align:center;animation:fade 3s forwards}
.toast.bad{color:var(--danger)} .toast.good{color:var(--ok)}
.banner{position:absolute;left:0;right:0;top:28%;text-align:center;pointer-events:none;font-family:var(--display);font-size:clamp(1.8rem,6vw,3.4rem);color:#fff;text-shadow:0 4px 0 rgba(0,0,0,.45);opacity:0;transition:opacity .4s}
.banner small{display:block;font-family:var(--body);font-weight:800;font-size:1rem;text-shadow:0 2px 0 rgba(0,0,0,.5)}
.banner.show{opacity:1}
@keyframes fade{0%,80%{opacity:1}100%{opacity:0}}
.controls{position:absolute;right:12px;bottom:12px;display:flex;gap:10px;align-items:flex-end}
.btn{font-family:var(--display);font-size:1rem;border:0;border-radius:16px;padding:12px 16px;cursor:pointer;color:#1b1400;background:var(--gold);box-shadow:0 4px 0 #7a5a00;min-width:96px}
.btn:active{transform:translateY(3px);box-shadow:0 1px 0 #7a5a00}
.btn:disabled{background:#4b5f5c;color:#a8b8b4;box-shadow:0 4px 0 #26332f;cursor:default}
.btn.lock{background:var(--ice);box-shadow:0 4px 0 #1d6b8c}
.btn:focus-visible{outline:3px solid var(--ink);outline-offset:2px}
.btn.big{min-width:130px;padding:16px 18px}
.err{position:absolute;inset:0;display:grid;place-items:center;text-align:center;padding:20px;font-weight:800}
@media (max-width:700px){.help{display:none}.panel{font-size:.68rem;padding:6px 8px}.guide{min-width:0}.board{min-width:0}h1{font-size:1.3rem}.btn.big{min-width:110px}}
@media (prefers-reduced-motion:reduce){.toast{animation:none}.banner{transition:none}}
</style>
</head>
<body>

<div class="app">
  <header>
    <h1>Egg Heist</h1>
    <div class="stat"><b id="coins">0</b><span>Coins</span></div>
    <div class="stat"><b id="income">0/s</b><span>Income</span></div>
    <div class="stat"><b id="speed">8.0</b><span>Speed</span></div>
    <div class="stat"><b id="carry">—</b><span>Carrying</span></div>
    <div class="help">Move: WASD / arrows · Look: click, then move mouse (Esc frees cursor) · Zoom: scroll · Action: E / Space · Lock: L</div>
  </header>
  <div class="stage" id="stage">
    <canvas id="cv"></canvas>
    <div class="panel board"><h2>Net worth</h2><div id="board"></div></div>
    <div class="banner" id="banner"></div>
    <div class="toasts" id="toasts"></div>
    <div class="controls">
      <button class="btn lock" id="lockBtn">Lock base</button>
      <button class="btn big" id="actBtn">Action</button>
    </div>
  </div>
</div>

<script src="https://cdnjs.cloudflare.com/ajax/libs/three.js/r128/three.min.js"></script>
<script>
(()=>{
const stage=document.getElementById('stage'),cv=document.getElementById('cv');
if(!window.THREE){stage.insertAdjacentHTML('beforeend','<div class="err">The 3D engine could not load. Check your connection and reload.</div>');return;}

// ---------- data ----------
const RAR=[
 {n:'Common',c:'#c3d39b',price:25,inc:1,hatch:5,mon:'Pebblet'},
 {n:'Rare',c:'#4fb3ff',price:120,inc:5,hatch:8,mon:'Fizzwing'},
 {n:'Epic',c:'#b77bff',price:500,inc:18,hatch:12,mon:'Glumbo'},
 {n:'Legendary',c:'#ffb020',price:2000,inc:70,hatch:18,mon:'Sunscale'},
 {n:'Mythic',c:'#ff4d8d',price:8000,inc:260,hatch:25,mon:'Voidmoth'},
 {n:'Enchanted',c:'#6dffd6',price:30000,inc:900,hatch:32,mon:'Glimmerkin'},
 {n:'Abyssal',c:'#2fa8ff',price:110000,inc:3000,hatch:40,mon:'Tidefin'},
 {n:'Summit',c:'#f2f6ff',price:400000,inc:10000,hatch:50,mon:'Frostcrown'}];
const BIOMES=[
 {name:'Meadow',ground:'#7cc45a',sky:'#a8dcef',pred:'Fox',pc:'#e8742a',speed:5.5},
 {name:'Forest',ground:'#3d7a3a',sky:'#8fc4b5',pred:'Wolf',pc:'#6f747d',speed:8.5},
 {name:'Desert',ground:'#e3c37a',sky:'#f4dcae',pred:'Scorpion',pc:'#a8432a',speed:11},
 {name:'Tundra',ground:'#e9f1f6',sky:'#c9def0',pred:'Snow leopard',pc:'#cfd6de',speed:14},
 {name:'Volcano',ground:'#3a2a2a',sky:'#6a443c',pred:'Lava drake',pc:'#ff5a1f',speed:18},
 {name:'Enchanted Forest',ground:'#3b3166',sky:'#40305f',pred:'Shadow stag',pc:'#2e2450',speed:22},
 {name:'Under the Sea',ground:'#c9b98a',sky:'#0f5a80',pred:'Shark',pc:'#6c8394',speed:27,fog:[18,70]},
 {name:'The Alps',ground:'#8cbf6a',sky:'#9fd2f5',pred:'Yeti',pc:'#eef2f5',speed:33}];
const PATH_COL=['#a98c5e','#a98c5e','#a98c5e','#d7e2ea','#2a1c1c','#5d4a8a','#e6d9ab','#9a8f7a'];
BIOMES.forEach((b,i)=>{b.z0=8+i*44;b.z1=b.z0+38;});
const HOME_SKY='#b6e3f2';
const TREAD_RATE=[0.15,0.3,0.6,1.1,2,3,4.2,5.6],TREAD_COST=[60,400,2000,9000,35000,120000,400000];
const START_SPEED=8,MAX_SPEED=48,CARRY_MULT=0.8;
const XMAX=44,ZMIN=-33,ZMAX=BIOMES[BIOMES.length-1].z1+2;

// ---------- three setup ----------
const renderer=new THREE.WebGLRenderer({canvas:cv,antialias:true});
renderer.setPixelRatio(Math.min(2,devicePixelRatio||1));
renderer.shadowMap.enabled=true;renderer.shadowMap.type=THREE.PCFSoftShadowMap;
const scene=new THREE.Scene();scene.background=new THREE.Color(HOME_SKY);scene.fog=new THREE.Fog(HOME_SKY,55,130);
const sways=[],floaters=[];
const camera=new THREE.PerspectiveCamera(55,1,.1,400);
scene.add(new THREE.HemisphereLight('#ffffff','#4a6a3a',.85));
const sun=new THREE.DirectionalLight('#fff4dd',.85);sun.castShadow=true;sun.shadow.mapSize.set(2048,2048);
Object.assign(sun.shadow.camera,{left:-35,right:35,top:35,bottom:-35,near:1,far:120});scene.add(sun,sun.target);
function resize(){const r=stage.getBoundingClientRect();renderer.setSize(r.width,r.height,false);camera.aspect=r.width/r.height;camera.updateProjectionMatrix();}
addEventListener('resize',resize);resize();

const mats={};
const mat=(c,o={})=>{const k=c+JSON.stringify(o);return mats[k]||(mats[k]=new THREE.MeshLambertMaterial(Object.assign({color:c},o)));};
const G={box:new THREE.BoxGeometry(1,1,1),sph:new THREE.SphereGeometry(1,24,18),cone:new THREE.ConeGeometry(1,1,8),cyl:new THREE.CylinderGeometry(1,1,1,12)};
function mesh(g,c,sx,sy,sz,x,y,z,parent=scene,o){const m=new THREE.Mesh(G[g],mat(c,o));m.scale.set(sx,sy,sz);m.position.set(x,y,z);m.castShadow=true;m.receiveShadow=true;parent.add(m);return m;}
function plane(w,d,c,x,z,y=0){const m=new THREE.Mesh(new THREE.PlaneGeometry(w,d),mat(c));m.rotation.x=-Math.PI/2;m.position.set(x,y,z);m.receiveShadow=true;scene.add(m);return m;}
function label(text,color='#fff',scale=1){const c=document.createElement('canvas');c.width=256;c.height=64;const tex=new THREE.CanvasTexture(c);
  const s=new THREE.Sprite(new THREE.SpriteMaterial({map:tex,transparent:true,depthWrite:false}));s.scale.set(4*scale,1*scale,1);
  s.set=(t,col=color)=>{if(s.txt===t+col)return;s.txt=t+col;const x=c.getContext('2d');x.clearRect(0,0,256,64);x.font='36px "Lilita One",sans-serif';x.textAlign='center';x.textBaseline='middle';
    x.lineWidth=7;x.strokeStyle='rgba(0,0,0,.6)';x.strokeText(t,128,34);x.fillStyle=col;x.fillText(t,128,34);tex.needsUpdate=true;};
  s.set(text);return s;}
let seed=7;const rnd=()=>(seed=(seed*16807)%2147483647)/2147483647;

// ---------- world ----------
plane(100,50,'#6fb04f',0,-18);
plane(8,ZMAX+10,'#b89a6a',0,ZMAX/2-2,0.005);
BIOMES.forEach((b,i)=>{
  plane(92,38,b.ground,0,(b.z0+b.z1)/2,0.01);
  plane(8,38,PATH_COL[i],0,(b.z0+b.z1)/2,0.02);
  const sign=label(b.name.toUpperCase(),'#fff',1.6);sign.position.set(0,5,b.z0-1);scene.add(sign);
  for(let k=0;k<38;k++){const x=(rnd()*2-1)*44,z=b.z0+rnd()*38;if(Math.abs(x)<6)continue;
    if(i===0){if(rnd()<.6)mesh('sph',['#ff6fa8','#ffe066','#ffffff'][k%3],.35,.35,.35,x,.35,z);else mesh('sph','#5aa344',1.2,.9,1.2,x,.6,z);}
    if(i===1){const h=4+rnd()*3;mesh('cyl','#6b4a2b',.3,h*.4,.3,x,h*.2,z);mesh('cone','#2f6b33',1.8,h,1.8,x,h*.4+h/2,z);}
    if(i===2){if(rnd()<.5){mesh('cyl','#4f9a4a',.45,3,.45,x,1.5,z);mesh('cyl','#4f9a4a',.3,1.2,.3,x+.7,2,z);}else mesh('sph','#c9a35a',2.4,.7,1.8,x,.2,z);}
    if(i===3){if(rnd()<.5)mesh('box','#a9dcf2',1.6,1.2+rnd()*1.6,1.6,x,.8,z,scene,{transparent:true,opacity:.8});else{mesh('cone','#f4f8fb',1.6,4.5,1.6,x,2.25,z);}}
    if(i===4){if(rnd()<.45){const l=mesh('cyl','#ff6a1f',1.4+rnd(),.06,1.4+rnd(),x,.04,z,scene,{emissive:'#ff4a00',emissiveIntensity:.9});l.castShadow=false;}else mesh('cone','#2a1e1e',1.5,1.5+rnd()*2.5,1.5,x,1.2,z);}
    if(i===5){const r=rnd();
      if(r<.4){const cap=['#ff7ad9','#6dffd6','#9d8cff'][k%3],h=.6+rnd()*1.4;mesh('cyl','#efe6ff',.18+h*.08,h,.18+h*.08,x,h/2,z);
        mesh('sph',cap,.6+h*.4,.35+h*.15,.6+h*.4,x,h,z,scene,{emissive:cap,emissiveIntensity:.55});}
      else if(r<.8){const h=5+rnd()*3,tr=new THREE.Group();tr.position.set(x,0,z);scene.add(tr);
        const t1=mesh('cyl','#3a2550',.35,h*.55,.35,0,h*.27,0,tr);t1.rotation.z=.12;const t2=mesh('cyl','#3a2550',.28,h*.5,.28,.3,h*.7,0,tr);t2.rotation.z=-.2;
        const lc=rnd()<.5?'#c07bff':'#5ff3d2';[[0,h,0,1.9],[.9,h*.92,.5,1.3],[-.8,h*.95,-.4,1.4]].forEach(([a,b2,c2,r2])=>mesh('sph',lc,r2,r2*.8,r2,a,b2,c2,tr,{emissive:lc,emissiveIntensity:.25}));}
      else{const f=mesh('sph','#fff6a8',.09,.09,.09,x,1+rnd()*2.5,z,scene,{emissive:'#fff27a',emissiveIntensity:1.5});f.castShadow=false;f.userData={y0:f.position.y,ph:rnd()*6,kind:'fly'};floaters.push(f);}}
    if(i===6){const r=rnd();
      if(r<.35){const g2=new THREE.Group();g2.position.set(x,0,z);scene.add(g2);const h=2.5+rnd()*3.5;
        for(let q=0;q<3;q++){const w=mesh('cyl','#3f9a5a',.12,h,.12,(q-1)*.25,h/2,0,g2);}g2.userData={ph:rnd()*6};sways.push(g2);}
      else if(r<.7){const cc=['#ff7a6b','#ffb347','#ff5fa8','#b58bff'][k%4];
        if(rnd()<.5)for(let q=0;q<4;q++){const br=mesh('cyl',cc,.18,1.4+rnd(),.18,x+(rnd()-.5),.8,z+(rnd()-.5));br.rotation.z=(rnd()-.5)*.9;br.rotation.x=(rnd()-.5)*.9;}
        else mesh('sph',cc,1+rnd()*.6,.7,1+rnd()*.6,x,.35,z);}
      else if(r<.82)mesh('sph','#7a8a8a',1.4+rnd(),.9,1.2+rnd(),x,.3,z);
      else{const bb=mesh('sph','#dff6ff',.12+rnd()*.12,.12,.12,x,rnd()*8,z,scene,{transparent:true,opacity:.45});bb.castShadow=false;bb.scale.y=bb.scale.x;bb.userData={kind:'bubble',sp:.8+rnd()*1.2,x0:x,ph:rnd()*6};floaters.push(bb);}}
    if(i===7){const r=rnd();
      if(r<.45){const h=4+rnd()*3;mesh('cyl','#5a3e26',.25,1.2,.25,x,.6,z);[0,1,2].forEach(q=>mesh('cone','#24553a',1.6-q*.4,h*.45,1.6-q*.4,x,1+q*h*.25+h*.2,z));}
      else if(r<.65)mesh('sph','#8c8f94',1+rnd(),.7+rnd()*.5,1+rnd(),x,.4,z);
      else mesh('sph',['#ffffff','#ffd84a','#c98bff'][k%3],.22,.22,.22,x,.22,z);}
  }
  if(i===7)[-1,1].forEach(sd=>{for(let q=0;q<4;q++){const mx=sd*(62+rnd()*14),mz=b.z0+q*10+rnd()*6,h=26+rnd()*18,w=14+rnd()*6;
    mesh('cone','#7d8794',w,h,w,mx,h/2,mz);mesh('cone','#ffffff',w*.42,h*.42,w*.42,mx,h*.79+.05,mz);}});

});

// ---------- bases ----------
const BASE_CX=[0,-28,28],NAMES=['You','Bramble','Nox'],COLS=['#ffd23f','#ff6b6b','#8c7bff'];
const bases=BASE_CX.map((cx,i)=>({i,cx,x0:cx-10,x1:cx+10,z0:-29,z1:-7,peds:[],tread:{x:cx+5,z:-24.5}}));
const pedestals=[];
bases.forEach((b,i)=>{
  const col=COLS[i];plane(20,22,col,b.cx,-18,0.01).material=new THREE.MeshLambertMaterial({color:col,transparent:true,opacity:.28});
  mesh('box',col,.4,1,22,b.x0,.5,-18);mesh('box',col,.4,1,22,b.x1,.5,-18);mesh('box',col,20,1,.4,b.cx,.5,b.z0);
  const s=label(i===0?'YOUR BASE':NAMES[i].toUpperCase(),col,1.3);s.position.set(b.cx,4.2,b.z0+1);scene.add(s);
  for(let r=0;r<2;r++)for(let c=0;c<3;c++){const p={base:i,x:b.cx-6+c*6,z:-11-r*6,item:null,key:'',holder:new THREE.Group(),lab:label('','#fff',.7)};
    mesh('cyl','#2c4b46',1.1,.5,1.1,p.x,.25,p.z);p.holder.position.set(p.x,.5,p.z);scene.add(p.holder);p.lab.position.set(p.x,3.1,p.z);scene.add(p.lab);b.peds.push(p);pedestals.push(p);}
  const t=b.tread;mesh('box','#33383d',2.4,.35,4.2,t.x,.18,t.z);mesh('box','#1d2124',2,.08,3.8,t.x,.38,t.z);
  mesh('box','#33383d',.15,1.4,.15,t.x-1.1,1,t.z+2);mesh('box','#33383d',.15,1.4,.15,t.x+1.1,1,t.z+2);mesh('box','#55606a',2.4,.15,.3,t.x,1.7,t.z+2);
  t.lab=label('TREADMILL',col,.8);t.lab.position.set(t.x,2.6,t.z);scene.add(t.lab);
  b.dome=mesh('box','#7fd8ff',20.6,4,22.6,b.cx,2,-18,scene,{transparent:true,opacity:.22});b.dome.castShadow=false;b.dome.visible=false;
});

// ---------- meshes: characters, eggs, creatures, predators ----------
const bobbers=[];
function makeEgg(r){const g=new THREE.Group();const e=mesh('sph',RAR[r].c,.6,.8,.6,0,.8,0,g);
  mesh('sph','#ffffff',.14,.2,.14,-.25,1.1,.45,g,{transparent:true,opacity:.6});
  if(r>=3){const h=mesh('sph',RAR[r].c,.75,.95,.75,0,.8,0,g,{transparent:true,opacity:.25,emissive:RAR[r].c});h.castShadow=false;}
  g.userData.wobble=true;return g;}
function makeMon(r){const g=new THREE.Group(),c=RAR[r].c,body=new THREE.Group();g.add(body);
  mesh('sph',c,r===2?.95:.75,r===2?.85:.75,r===2?.95:.75,0,.9,0,body);
  [-1,1].forEach(s=>{mesh('sph','#ffffff',.2,.2,.2,s*.28,1.05,.62,body);mesh('sph','#111111',.1,.1,.1,s*.28,1.05,.78,body);});
  if(r===0){mesh('cone',c,.2,.4,.2,-.35,1.65,0,body);mesh('cone',c,.2,.4,.2,.35,1.65,0,body);}
  if(r===1||r===4)[-1,1].forEach(s=>{const w=mesh('sph',r===4?'#2b1030':c,.6,.05,.34,s*.9,1.1,-.1,body,r===4?{emissive:'#ff4d8d',emissiveIntensity:.4}:{});w.rotation.z=s*.4;});
  if(r===2)mesh('cone','#ffe9a8',.25,.7,.25,0,1.95,.1,body);
  if(r===3)for(let k=0;k<8;k++){const a=k/8*Math.PI*2;const s=mesh('cone','#fff2a8',.14,.4,.14,Math.cos(a)*.85,.9,Math.sin(a)*.85,body);s.rotation.z=-Math.cos(a)*1.4;s.rotation.x=Math.sin(a)*1.4;}
  if(r===5){[-1,1].forEach(s=>{const a=mesh('cyl','#bfffee',.04,.6,.04,s*.25,1.8,0,body);a.rotation.z=-s*.35;mesh('sph','#ffffff',.12,.12,.12,s*.38,2.1,0,body,{emissive:'#6dffd6',emissiveIntensity:1.2});});}
  if(r===6){mesh('cone','#1f6fd6',.18,.7,.5,0,1.75,-.1,body);[-1,1].forEach(s=>{const f=mesh('sph','#1f6fd6',.45,.08,.25,s*.75,.85,0,body);f.rotation.z=s*.5;});const t=mesh('cone','#1f6fd6',.35,.55,.12,0,.9,-.85,body);t.rotation.x=-Math.PI/2;}
  if(r===7){for(let k=0;k<5;k++){const a=k/5*Math.PI*2;mesh('cone','#9fdcff',.09,.45,.09,Math.cos(a)*.35,1.75,Math.sin(a)*.35,body,{emissive:'#7fd8ff',emissiveIntensity:.6});}mesh('cyl','#ffd84a',.42,.12,.42,0,1.58,0,body,{emissive:'#ffb000',emissiveIntensity:.3});}
  body.userData.bob=Math.random()*6;bobbers.push(body);return g;}
function makeItem(it){return it.hatched?makeMon(it.r):makeEgg(it.r);}
// ---- smooth model kit: per-pixel shaded materials, capsule limbs, jointed rigs ----
const matS=(c,o={})=>{const k='S'+c+JSON.stringify(o);return mats[k]||(mats[k]=new THREE.MeshStandardMaterial(Object.assign({color:c,roughness:.8,metalness:0},o)));};

const joint=(parent,x=0,y=0,z=0)=>{const j=new THREE.Group();j.position.set(x,y,z);parent.add(j);return j;};
const lerpAng=(a,b,t)=>{const d=((b-a+Math.PI)%(Math.PI*2)+Math.PI*2)%(Math.PI*2)-Math.PI;return a+d*t;};

function makeChar(col,look){

    const ankle=joint(knee,0,-.56,0);ell(shoe,ankle,.095,.07,.18,0,-.06,.06);return{hip,knee,ankle};});

function animChar(u,ph,a,t){

    L.hip.rotation.x=-sn*.6*a;L.knee.rotation.x=a*(.12+1.05*Math.max(0,Math.cos(p)));L.ankle.rotation.x=-L.hip.rotation.x*.3-L.knee.rotation.x*.45;});

function updateTrail(){
  const spd=moveSpeed(me),fast=me.moving&&spd>=TRAIL_MIN;

    if(!trail.unlocked){trail.unlocked=true;toast('Light trail unlocked! Get faster to change its colour','good');}
    else if(tier>trail.tier&&trail.tier>=0)toast(TRAIL_TIERS[tier][2][0].toUpperCase()+TRAIL_TIERS[tier][2].slice(1)+' trail unlocked!','good');
    trail.tier=Math.max(trail.tier,tier);trail.col.set(TRAIL_TIERS[tier][1]);
    const lastP=trail.pts[0];if(!lastP||Math.hypot(lastP.x-me.x,lastP.z-me.z)>.2)trail.pts.unshift({x:me.x,z:me.z,t:time});
  }

function grabNest(p,n){p.carry={item:{r:n.biome,t:RAR[n.biome].hatch,hatched:false},from:n,kind:'nest'};n.egg=false;n.respawn=6+n.biome*3;
  let woke=0;preds.forEach(pr=>{if(pr.biome!==n.biome)return;if(pr.state==='sleep'||pr.state==='return'){pr.state='waking';pr.wakeAt=time+WAKE_DELAY;woke++;}if(!pr.target)pr.target=p;});
  const nm=BIOMES[n.biome].pred.toLowerCase()+'s';
  if(!p.ai)toast(woke?'You woke the '+nm+'! RUN!':'Grabbed a '+RAR[n.biome].n+' egg. Run home!','bad');
  else if(biomeAt(me.z)===n.biome)toast(p.name+' woke the '+nm+'!','');}
const WAKE_DELAY=1,AI_PACE=.35;
function stealPed(p,ped){if(locked(ped.base)){if(!p.ai)toast(players[ped.base].name+"'s base is locked",'bad');return;}
  p.carry={item:ped.item,from:ped,kind:'ped'};ped.item=null;
  if(ped.base===0)toast(p.name+' grabbed your '+itemLabel(p.carry.item)+'! Chase them!','bad');
  else if(!p.ai)toast('Stole '+itemLabel(p.carry.item)+'. Run!','good');}
function sell(p,ped){const v=Math.floor(itemValue(ped.item)*.5);p.coins+=v;if(!p.ai)toast('Sold '+itemLabel(ped.item)+' for '+fmt(v),'good');ped.item=null;}
function upgradeTread(p){if(p.tread>=TREAD_COST.length)return;const c=TREAD_COST[p.tread];
  if(p.coins<c){if(!p.ai)toast('Need '+fmt(c)+' coins to upgrade','bad');return;}p.coins-=c;p.tread++;if(!p.ai)toast('Treadmill level '+(p.tread+1)+': training is faster','good');}
function place(p){const ped=emptyPed(p.id);if(!ped)return;ped.item=p.carry.item;
  if(p.carry.kind==='ped'&&p.carry.from.base===0)toast(p.name+' got away with your '+itemLabel(ped.item),'bad');
  if(!p.ai)toast('Placed '+itemLabel(ped.item)+' at your base','good');p.carry=null;}
function lock(p){if(p.lockCd>time||p.lockUntil>time)return;p.lockUntil=time+15;p.lockCd=time+45;if(!p.ai)toast('Base locked for 15s','good');}
function dropToNest(p){const n=p.carry.from;if(p.carry.kind==='nest'&&!n.egg){n.egg=true;n.respawn=0;}else if(p.carry.kind==='ped'){const back=p.carry.from.item?emptyPed(p.carry.from.base):p.carry.from;if(back)back.item=p.carry.item;}p.carry=null;}
function caughtByPred(p,pr){const b=BIOMES[pr.biome];
  if(!p.ai)toast('A '+b.pred.toLowerCase()+' caught you'+(p.carry?' and took the egg back':'')+'!','bad');
  if(p.carry)dropToNest(p);const base=bases[p.id];p.x=base.cx-5;p.z=-24;p.safeUntil=time+2;p.state=null;pr.target=null;}

function nearestAction(p){
  if(p.carry)return null;
  if(onTread(p)&&p.tread<TREAD_COST.length)return{type:'upgrade'};
  let best=null,bd=2.4;
  for(const n of nests){if(!n.egg)continue;const d=dist(p,n);if(d<bd){bd=d;best={type:'grab',n};}}
  for(const q of pedestals){if(!q.item)continue;const d=dist(p,q);if(d<bd){bd=d;best={type:q.base===p.id?'sell':'steal',ped:q};}}
  return best;}
function doAction(p){const a=nearestAction(p);if(!a)return;
  if(a.type==='grab')grabNest(p,a.n);else if(a.type==='steal')stealPed(p,a.ped);else if(a.type==='sell')sell(p,a.ped);else upgradeTread(p);}

// ---------- AI ----------
function moveToward(p,tx,tz,dt,spd){const dx=tx-p.x,dz=tz-p.z,d=Math.hypot(dx,dz);if(d<.4)return true;const s=Math.min(d,spd*dt);p.x+=dx/d*s;p.z+=dz/d*s;p.face=Math.atan2(dx,dz);p.moving=true;return false;}
function aiThink(p){
  const b=bases[p.id];
  if(p.carry){p.state={type:'home'};return;}
  const thief=players.find(q=>q!==p&&q.carry&&q.carry.kind==='ped'&&q.carry.from.base===p.id);
  if(thief){p.state={type:'chase',t:thief};return;}
  if(players.some(q=>q!==p&&inBase(q,b))&&Math.random()<.4)lock(p);
  if(p.tread<TREAD_COST.length&&p.coins>TREAD_COST[p.tread]*1.4)upgradeTread(p);
  const safeBiome=BIOMES.reduce((m,bb,i)=>p.speed*CARRY_MULT>bb.speed+.5?i:m,0);
  if(Math.random()<.22&&p.speed<MAX_SPEED-2){p.state={type:'train',until:time+5+Math.random()*6};return;}
  if(!emptyPed(p.id)){const worst=b.peds.filter(q=>q.item).sort((x,y)=>itemValue(x.item)-itemValue(y.item))[0];
    if(worst&&worst.item.hatched&&worst.item.r<safeBiome&&Math.random()<.5){p.state={type:'sell',ped:worst};return;}}
  if(emptyPed(p.id)){
    if(Math.random()<.3){const opts=pedestals.filter(q=>q.item&&q.base!==p.id&&!locked(q.base)).sort((x,y)=>itemValue(y.item)*(y.base===0?1.3:1)-itemValue(x.item)*(x.base===0?1.3:1));
      if(opts.length){p.state={type:'raid',ped:opts[Math.floor(Math.random()*Math.min(3,opts.length))]};return;}}
    const choice=nests.filter(n=>n.egg&&n.biome<=safeBiome).sort((x,y)=>y.biome-x.biome||Math.abs(x.x-p.x)-Math.abs(y.x-p.x))[0];
    if(choice&&Math.random()<AI_PACE+.15){p.state={type:'nest',n:choice};return;}}
  p.state={type:'idle',x:b.cx-6+Math.random()*12,z:-26+Math.random()*16};
}
function aiUpdate(p,dt){
  p.think-=dt;
  if(!p.state||(p.think<=0&&!['train','nest','raid'].includes(p.state.type))){aiThink(p);p.think=1.3+Math.random()*1.4;}
  const s=p.state,spd=moveSpeed(p);
  if(s.type==='home'){const ped=emptyPed(p.id),b=bases[p.id];moveToward(p,ped?ped.x:b.cx,ped?ped.z:-18,dt,spd);if(!p.carry)p.state=null;}
  else if(s.type==='chase'){const t=s.t;if(!t.carry||t.carry.kind!=='ped'||t.carry.from.base!==p.id){p.state=null;p.noticed={};return;}
    p.noticed[t.id]=(p.noticed[t.id]||0)+dt;if(p.noticed[t.id]>.9)moveToward(p,t.x,t.z,dt,spd);}
  else if(s.type==='train'){const t=bases[p.id].tread;if(moveToward(p,t.x,t.z,dt,spd)&&time>s.until)p.state=null;}
  else if(s.type==='nest'){if(!s.n.egg){p.state=null;return;}if(moveToward(p,s.n.x,s.n.z,dt,spd)||dist(p,s.n)<1.5){grabNest(p,s.n);p.state={type:'home'};}}
  else if(s.type==='raid'){if(!s.ped.item||locked(s.ped.base)){p.state=null;return;}if(moveToward(p,s.ped.x,s.ped.z,dt,spd)||dist(p,s.ped)<1.5){stealPed(p,s.ped);p.state={type:'home'};}}
  else if(s.type==='sell'){if(!s.ped.item){p.state=null;return;}if(moveToward(p,s.ped.x,s.ped.z,dt,spd)){sell(p,s.ped);p.state=null;}}
  else if(s.type==='idle'){if(moveToward(p,s.x,s.z,dt,spd*.4))p.moving=false;}
}

// ---------- predators ----------
function predUpdate(pr,dt){
  const b=BIOMES[pr.biome],inZone=p=>p.z>b.z0-3&&p.z<b.z1+3&&p.safeUntil<time;
  const isThief=p=>p&&p.carry&&p.carry.kind==='nest'&&p.carry.from.biome===pr.biome&&inZone(p);
  pr.moving=false;pr.v=0;
  if(pr.state==='waking'||pr.state==='chase'){
    if(!isThief(pr.target)){let best=null,bd=1e9;for(const p of players)if(isThief(p)){const d=dist(p,pr);if(d<bd){bd=d;best=p;}}pr.target=best;}
    if(!pr.target)pr.state='return';
    else if(pr.state==='waking'){pr.face=Math.atan2(pr.target.x-pr.x,pr.target.z-pr.z);if(time>=pr.wakeAt)pr.state='chase';}
    else{const t=pr.target;moveTo(pr,t.x,t.z,b.speed,dt);if(dist(pr,t)<1.3){caughtByPred(t,pr);pr.target=null;pr.state='return';}}}
  if(pr.state==='return'){moveTo(pr,pr.hx,pr.hz,b.speed*.3,dt);if(!pr.moving){pr.state='sleep';pr.target=null;}}
  pr.x=Math.max(-XMAX,Math.min(XMAX,pr.x));pr.z=Math.max(b.z0-2,Math.min(b.z1+2,pr.z));
  const m=pr.mesh,u=m.userData;m.position.set(pr.x,0,pr.z);
  const want=pr.moving?Math.min(1.3,.3+pr.v/12):0;pr.amt=(pr.amt||0)+(want-(pr.amt||0))*Math.min(1,dt*8);
  if(pr.moving)pr.walk+=pr.v*dt*Math.PI*2/(u.stride*PRED_SCALE[pr.biome]*(1+pr.v*.03));
  m.rotation.y=lerpAng(m.rotation.y,pr.face||0,Math.min(1,dt*(pr.state==='waking'?6:10)));
  const hunting=pr.state==='waking'||pr.state==='chase';
  animPred(u,pr.walk,pr.amt,time,hunting);
  // blend toward the sleeping pose: fast to wake, slow to doze off
  const sTarget=pr.state==='sleep'?1:0;pr.sleep+=(sTarget-pr.sleep)*Math.min(1,dt*(sTarget?1.5:7));
  sleepPose(u,pr.sleep,time+pr.zzPh);
  u.eyes.forEach(e=>{if(e.userData.sy===undefined)e.userData.sy=e.scale.y;e.scale.y=e.userData.sy*(pr.sleep>.6?.12:1);e.material=hunting?EYE_HUNT:EYE_IDLE;});
  const zz=pr.zz;zz.visible=pr.sleep>.85;if(zz.visible){zz.position.set(pr.x,u.zzY*PRED_SCALE[pr.biome]+Math.sin(time*1.5+pr.zzPh)*.25,pr.z);zz.material.opacity=.55+Math.sin(time*2+pr.zzPh)*.35;}
}
const mix=(a,b,t)=>a+(b-a)*t;
function sleepPose(u,s,t){
  if(s<.001)return;const br=Math.sin(t*1.6)*.03*s;
  if(u.biped){u.body.position.y=mix(u.body.position.y,-.62+br*.5,s);
    u.legs.forEach(L=>{L.hip.rotation.x=mix(L.hip.rotation.x,-1.45,s);L.knee.rotation.x=mix(L.knee.rotation.x,1.45,s);L.ankle.rotation.x=mix(L.ankle.rotation.x,0,s);});
    u.arms.forEach((A,i)=>{A.sh.rotation.x=mix(A.sh.rotation.x,-.55,s);A.sh.rotation.z=mix(A.sh.rotation.z,(i?1:-1)*.25,s);A.elbow.rotation.x=mix(A.elbow.rotation.x,-.9,s);});
    u.torso.rotation.x=mix(u.torso.rotation.x,.3,s);u.torso.rotation.y=mix(u.torso.rotation.y,0,s);u.head.rotation.x=mix(u.head.rotation.x,.55,s);return;}
  if(u.shark){u.body.position.y=mix(u.body.position.y,.75+br,s);u.body.rotation.z=mix(u.body.rotation.z,0,s);return;}
  if(u.scorp){u.body.position.y=mix(u.body.position.y,.16,s);u.legs.forEach(L=>{L.hip.rotation.y=mix(L.hip.rotation.y,0,s);L.hip.rotation.x=mix(L.hip.rotation.x,.25,s);});
    u.tail.forEach((q,k)=>{if(k>0)q.rotation.x=mix(q.rotation.x,.2,s);});return;}
  u.body.position.y=mix(u.body.position.y,u.lieY+br,s);u.body.rotation.x=mix(u.body.rotation.x,0,s);
  u.head.rotation.x=mix(u.head.rotation.x,.6,s);u.head.rotation.y=mix(u.head.rotation.y,.35,s);
  u.legs.forEach(L=>{L.hip.rotation.x=mix(L.hip.rotation.x,L.front?-1.35:1.35,s);L.knee.rotation.x=mix(L.knee.rotation.x,0,s);});
  u.tail.forEach((q,k)=>{q.rotation.y=mix(q.rotation.y,k?.35:.6,s);});
  u.wings.forEach(W=>{W.w.rotation.z=mix(W.w.rotation.z,W.s*-.25,s);});
}
function moveTo(o,tx,tz,spd,dt){const dx=tx-o.x,dz=tz-o.z,d=Math.hypot(dx,dz);if(d<.3){o.moving=false;o.v=0;return;}const s=Math.min(d,spd*dt);o.x+=dx/d*s;o.z+=dz/d*s;
  o.face=Math.atan2(dx,dz);o.moving=true;o.v=s/dt;}

// ---------- update ----------
let lastBiome=-2,trainNote=0;
function update(dt){
  time+=dt;
  // player input (camera looks down +z, so screen-right is -x)
  let ix=(keys.d||keys.arrowright?1:0)-(keys.a||keys.arrowleft?1:0)+joy.dx;
  let iz=(keys.w||keys.arrowup?1:0)-(keys.s||keys.arrowdown?1:0)-joy.dy;
  const m=Math.hypot(ix,iz);if(m>1){ix/=m;iz/=m;}
  me.moving=m>.05;if(me.moving){const s=moveSpeed(me),fx=Math.sin(cam.yaw),fz=Math.cos(cam.yaw);
    const dx=-fz*ix+fx*iz,dz=fx*ix+fz*iz;me.x+=dx*s*dt;me.z+=dz*s*dt;me.face=Math.atan2(dx,dz);}
  players.forEach(p=>{if(p.ai){p.moving=false;aiUpdate(p,dt);}});
  players.forEach(p=>{
    p.x=Math.max(-XMAX,Math.min(XMAX,p.x));p.z=Math.max(ZMIN,Math.min(ZMAX,p.z));
    bases.forEach((b,i)=>{if(i!==p.id&&locked(i)&&inBase(p,b)){const l=p.x-b.x0,r=b.x1-p.x,t=p.z-b.z0,f=b.z1-p.z,mn=Math.min(l,r,t,f);
      if(mn===l)p.x=b.x0-.2;else if(mn===r)p.x=b.x1+.2;else if(mn===t)p.z=b.z0-.2;else p.z=b.z1+.2;}});
    if(p.carry&&inBase(p,bases[p.id]))place(p);
    if(onTread(p)&&!p.carry){const gain=TREAD_RATE[p.tread]*dt*(1-p.speed/(MAX_SPEED+4))*(p.ai?AI_PACE:1);p.speed=Math.min(MAX_SPEED,p.speed+gain);p.training=true;}else p.training=false;
  });
  if(me.training&&time>trainNote){trainNote=time+20;toast('Training. Stay on the treadmill to get faster','good');}
  // thieves caught by base owners
  players.forEach(t=>{if(!t.carry||t.carry.kind!=='ped')return;const owner=players[t.carry.from.base];if(owner===t)return;
    if(dist(owner,t)<1.6){if(owner===me)toast('Caught '+t.name+'! Got your '+itemLabel(t.carry.item)+' back','good');else if(t===me)toast(owner.name+' caught you and took it back','bad');
      dropToNest(t);t.state=null;owner.state=null;owner.noticed={};}});
  preds.forEach(pr=>predUpdate(pr,dt));
  // nests respawn
  nests.forEach(n=>{if(!n.egg){n.respawn-=dt;if(n.respawn<=0)n.egg=true;}});
  // hatching + income
  pedestals.forEach(q=>{const it=q.item;if(!it)return;
    if(!it.hatched){it.t-=dt;if(it.t<=0){it.hatched=true;if(q.base===0)toast('Your '+RAR[it.r].n+' egg hatched into a '+RAR[it.r].mon+'!','good');}}
    else players[q.base].coins+=RAR[it.r].inc*dt;});
  // biome banner
  const bi=biomeAt(me.z);if(bi!==lastBiome){lastBiome=bi;if(bi>=0){const b=BIOMES[bi];banner(b.name,b.pred+'s run at '+b.speed+' · '+RAR[bi].n+' eggs');}}
}

// ---------- render sync ----------
const sky=new THREE.Color(HOME_SKY),tmpC=new THREE.Color(),tmpV=new THREE.Vector3(),camTarget=new THREE.Vector3(0,1.5,-21);
function sync(dt){
  players.forEach(p=>{const g=p.mesh;g.position.set(p.x,0,p.z);
    let v=p.px===undefined?0:Math.hypot(p.x-p.px,p.z-p.pz)/Math.max(dt,1e-4);p.px=p.x;p.pz=p.z;if(v>45)v=0;
    if(p.training){v=p.speed;p.face=0;}
    const want=v<.3?0:Math.min(1.3,.35+v/14);p.amt=(p.amt||0)+(want-(p.amt||0))*Math.min(1,dt*8);
    p.walk+=v*dt*Math.PI*2/(1.5+v*.07);
    if(p.face!==undefined)g.rotation.y=lerpAng(g.rotation.y,p.face,Math.min(1,dt*12));
    animChar(g.userData,p.walk,p.amt,time);
    g.visible=p.safeUntil<time||Math.floor(time*10)%2===0;
    const k=p.carry?p.carry.item.r+(p.carry.item.hatched?'h':'e'):'';if(k!==p.carryKey){p.carryKey=k;const c=g.userData.carry;c.clear();if(p.carry)c.add(makeItem(p.carry.item));}
    p.lab.set(p.name+(p.ai?' · '+p.speed.toFixed(0):''),p.color);});
  pedestals.forEach(q=>{const k=q.item?q.item.r+(q.item.hatched?'h':'e'):'';if(k!==q.key){q.key=k;q.holder.clear();if(q.item)q.holder.add(makeItem(q.item));}
    q.lab.set(q.item?(q.item.hatched?'+'+RAR[q.item.r].inc+'/s':Math.ceil(q.item.t)+'s'):'',q.item&&q.item.hatched?'#ffd23f':'#ffffff');
    q.holder.rotation.y=q.item&&!q.item.hatched?Math.sin(time*6+q.x)*.15:0;});
  updateTrail();
  nests.forEach(n=>{n.holder.visible=n.egg;n.holder.rotation.z=Math.sin(time*3+n.x)*.08;});
  bobbers.forEach(b=>{b.position.y=Math.abs(Math.sin(time*3+b.userData.bob))*.3;});
  sways.forEach(w=>{w.rotation.z=Math.sin(time*1.2+w.userData.ph)*.12;w.rotation.x=Math.cos(time*.9+w.userData.ph)*.08;});
  floaters.forEach(f=>{const d=f.userData;if(d.kind==='fly'){f.position.y=d.y0+Math.sin(time*1.7+d.ph)*.5;f.position.x+=Math.sin(time*.8+d.ph)*.01;}
    else{f.position.y+=d.sp*dt;f.position.x=d.x0+Math.sin(time*2+d.ph)*.3;if(f.position.y>9)f.position.y=0;}});
  bases.forEach((b,i)=>{b.dome.visible=locked(i);});
  // camera + sun
  const tx=me.x,tz=me.z,fx=Math.sin(cam.yaw),fz=Math.cos(cam.yaw),h=Math.cos(cam.pitch)*cam.dist;
  camTarget.lerp(tmpV.set(tx+fx*3,1.5,tz+fz*3),.25);
  camera.position.set(camTarget.x-fx*h,camTarget.y+Math.sin(cam.pitch)*cam.dist,camTarget.z-fz*h);
  if(camera.position.y<1)camera.position.y=1;
  camera.lookAt(camTarget);
  sun.position.set(tx+20,40,tz-10);sun.target.position.set(tx,0,tz);
  const bi=biomeAt(me.z);tmpC.set(bi>=0?BIOMES[bi].sky:HOME_SKY);sky.lerp(tmpC,.03);scene.background.copy(sky);scene.fog.color.copy(sky);
  const fg=bi>=0&&BIOMES[bi].fog||[55,130];scene.fog.near+=(fg[0]-scene.fog.near)*.04;scene.fog.far+=(fg[1]-scene.fog.far)*.04;
}

// ---------- HUD ----------
const $=id=>document.getElementById(id);
function hud(){
  $('coins').textContent=fmt(me.coins);
  $('income').textContent=fmt(bases[0].peds.reduce((s,q)=>s+(q.item&&q.item.hatched?RAR[q.item.r].inc:0),0))+'/s';
  $('speed').textContent=moveSpeed(me).toFixed(1)+(me.training?' ▲':'');
  $('carry').textContent=me.carry?itemLabel(me.carry.item):'—';
  const a=nearestAction(me),btn=$('actBtn');
  if(me.carry){btn.textContent=emptyPed(0)?'Run home!':'Base full';btn.disabled=true;}
  else if(!a){btn.textContent=onTread(me)?'Max treadmill':'Action';btn.disabled=true;}
  else{btn.disabled=false;btn.textContent=a.type==='grab'?'Grab egg':a.type==='steal'?'Steal':a.type==='sell'?'Sell '+fmt(itemValue(a.ped.item)*.5):'Upgrade '+fmt(TREAD_COST[me.tread]);}
  const lb=$('lockBtn');if(me.lockUntil>time){lb.disabled=true;lb.textContent='Locked '+Math.ceil(me.lockUntil-time)+'s';}
  else if(me.lockCd>time){lb.disabled=true;lb.textContent='Ready in '+Math.ceil(me.lockCd-time)+'s';}else{lb.disabled=false;lb.textContent='Lock base';}
    $('board').innerHTML=[...players].sort((x,y)=>netWorth(y)-netWorth(x)).map(p=>`<div class="row"><i style="background:${p.color}"></i>${p.name}<em>${fmt(netWorth(p))}</em></div>`).join('');
}

let last=performance.now(),hudT=0;
function frame(now){const dt=Math.min(.05,(now-last)/1000);last=now;update(dt);sync(dt);renderer.render(scene,camera);hudT-=dt;if(hudT<=0){hud();hudT=.15;}requestAnimationFrame(frame);}
camTarget.set(me.x,1.5,me.z+3);
toast('Head out to the biomes, grab eggs, and outrun the predators!');
if(matchMedia('(pointer:coarse)').matches)toast('Left side of the screen moves you. Drag on the right side to look around');
requestAnimationFrame(frame);
})();
</script>
